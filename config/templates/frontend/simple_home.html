<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競馬予測システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12 text-center">
                <h1 class="display-4 mb-4">
                    <i class="fas fa-horse-head text-primary"></i>
                    競馬予測システム
                </h1>
                <p class="lead mb-4">AIを活用した次世代の競馬予測プラットフォーム</p>
                
                <div class="alert alert-success" role="alert">
                    <h4 class="alert-heading">🎉 システム起動成功！</h4>
                    <p>競馬予測システムが正常に動作しています。</p>
                    <hr>
                    <p class="mb-0">以下の機能が利用可能です：</p>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-3 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <i class="fas fa-horse fa-2x text-primary mb-2"></i>
                                <h5>馬データ</h5>
                                <a href="/horses/" class="btn btn-primary btn-sm">詳細</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <i class="fas fa-flag-checkered fa-2x text-success mb-2"></i>
                                <h5>レース情報</h5>
                                <a href="/races/" class="btn btn-success btn-sm">詳細</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <i class="fas fa-brain fa-2x text-warning mb-2"></i>
                                <h5>AI予測</h5>
                                <a href="/predictions/" class="btn btn-warning btn-sm">詳細</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <i class="fas fa-chart-bar fa-2x text-info mb-2"></i>
                                <h5>分析機能</h5>
                                <a href="/analytics/" class="btn btn-info btn-sm">詳細</a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <h3>管理機能</h3>
                    <a href="/admin/" class="btn btn-dark btn-lg me-2">
                        <i class="fas fa-cog"></i> 管理画面
                    </a>
                    <a href="/api/v1/" class="btn btn-secondary btn-lg">
                        <i class="fas fa-code"></i> API
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
